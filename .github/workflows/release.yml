name: Release

# Pushing a tag such as v1.0.0 builds, per OS (profile "dist" of doom-app), and attaches to a GitHub release:
#   - the jpackage installer (.dmg, .exe, or an app-image tar.gz on Linux), with the shareware doom1.wad embedded;
#     the Windows .exe lets the user choose the install folder (default C:\Program Files\DoomJava) and opens .wad files;
#   - a portable zip (jlink runtime + iwads/doom1.wad + launcher, DoomJava.exe on Windows; no Java needed);
#   - a zip with the fat jar + iwads/doom1.wad (needs JDK 25).
# doom1.wad (.iwads/) is redistributed unmodified under the shareware terms, see ADR-023 and .iwads/README.md.
# Run by hand (workflow_dispatch), or by pushing a dist-test/* branch, it only builds the artifacts, as version 0.0.1,
# without a release.
on:
  push:
    tags: ["v*"]
    branches: ["dist-test/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            jpackage-type: dmg
          - name: macos-x64
            os: macos-15-intel
            jpackage-type: dmg
          - name: windows-x64
            os: windows-latest
            jpackage-type: exe
          - name: linux-x64
            os: ubuntu-latest
            jpackage-type: app-image
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Version from the tag
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.1" >> "$GITHUB_OUTPUT"
          fi

      # jpackage builds the .exe with the WiX Toolset (v3 candle/light, or the v4+ wix tool with its UI extension,
      # which the install folder dialog needs). Install it when the runner image does not have it.
      - name: WiX Toolset
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if command -v candle >/dev/null 2>&1 || command -v wix >/dev/null 2>&1; then
            echo "WiX found"
          else
            dotnet tool install --global wix --version 5.0.2
            echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"
            "$USERPROFILE/.dotnet/tools/wix" extension add --global WixToolset.Util.wixext/5.0.2
            "$USERPROFILE/.dotnet/tools/wix" extension add --global WixToolset.UI.wixext/5.0.2
          fi

      - name: Build installer
        shell: bash
        run: >
          ./mvnw -B -Pdist -pl doom-app -am package -DskipTests
          -Ddist.app.version=${{ steps.version.outputs.value }}
          -Ddist.jpackage.type=${{ matrix.jpackage-type }}
          -Ddist.portable.skip=true

      # Run from Git Bash on every OS (on Windows, `bash` inside Maven could be the WSL launcher).
      - name: Portable zips
        shell: bash
        run: |
          DOOM_PORTABLE_LABEL="${{ matrix.name }}" \
            bash doom-app/src/dist/make-portable.sh doom-app "${{ steps.version.outputs.value }}"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ matrix.jpackage-type }}" = "app-image" ]; then
            tar -C doom-app/target/dist/installer -czf "out/DoomJava-${{ steps.version.outputs.value }}-${{ matrix.name }}.tar.gz" .
          else
            for f in doom-app/target/dist/installer/*.*; do
              ext="${f##*.}"
              cp "$f" "out/DoomJava-${{ steps.version.outputs.value }}-${{ matrix.name }}.${ext}"
            done
          fi
          cp doom-app/target/dist/portable/*.zip out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: out/*

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
