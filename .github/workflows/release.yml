name: Release

# Pushing a tag such as v1.0.0 builds, per OS (profile "dist" of doom-app), and attaches to a GitHub release:
#   - the jpackage installer (.dmg, .msi, or an app-image tar.gz on Linux), with the shareware doom1.wad embedded;
#   - a portable zip (jlink runtime + iwads/doom1.wad + launcher; no Java needed);
#   - a zip with the fat jar + iwads/doom1.wad (needs JDK 25).
# doom1.wad (.iwads/) is redistributed unmodified under the shareware terms, see ADR-023 and .iwads/README.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            jpackage-type: dmg
          - name: macos-x64
            os: macos-15-intel
            jpackage-type: dmg
          - name: windows-x64
            os: windows-latest
            jpackage-type: msi
          - name: linux-x64
            os: ubuntu-latest
            jpackage-type: app-image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Version from the tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build installer
        shell: bash
        run: >
          ./mvnw -B -Pdist -pl doom-app -am package -DskipTests
          -Ddist.app.version=${{ steps.version.outputs.value }}
          -Ddist.jpackage.type=${{ matrix.jpackage-type }}
          -Ddist.portable.skip=true

      # Run from Git Bash on every OS (on Windows, `bash` inside Maven could be the WSL launcher).
      - name: Portable zips
        shell: bash
        run: |
          DOOM_PORTABLE_LABEL="${{ matrix.name }}" \
            bash doom-app/src/dist/make-portable.sh doom-app "${{ steps.version.outputs.value }}"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ matrix.jpackage-type }}" = "app-image" ]; then
            tar -C doom-app/target/dist/installer -czf "out/DoomJava-${{ steps.version.outputs.value }}-${{ matrix.name }}.tar.gz" .
          else
            cp doom-app/target/dist/installer/*.* out/
          fi
          cp doom-app/target/dist/portable/*.zip out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: out/*

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
