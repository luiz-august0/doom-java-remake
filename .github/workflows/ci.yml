name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests and the module build on every platform (integration tests that need IWADs are skipped here).
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        shell: bash
        run: ./mvnw -B verify

  # Demo sync against the patched Chocolate Doom oracle with the IWADs committed in .iwads/ (shareware doom1.wad and
  # Freedoom, ADR-023). Fails when any demo diverges from the oracle trace.
  sync:
    name: demo sync (Freedoom + oracle)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Oracle build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential libsdl2-dev

      - name: Cache the oracle build
        uses: actions/cache@v4
        with:
          path: tools/oracle/work
          key: oracle-${{ runner.os }}-${{ hashFiles('tools/oracle/build.sh', 'tools/oracle/chocolate-trace.patch') }}

      - name: Build the oracle
        run: tools/oracle/build.sh

      # FlowSyncIT (needs testdata/flow/secret.wad from make-flow-testdata.py), TitleLoopSyncIT and ReferenceTracesIT
      # are not in this list yet: see the W5-D report (they fail on main independently of the build configuration).
      - name: Run the sync suite
        env:
          DOOM_IWAD_DIR: ${{ github.workspace }}/.iwads
          DOOM_HOME: ${{ github.workspace }}
        run: >
          ./mvnw -B -pl doom-it -am verify
          -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false -Dit.failIfNoSpecifiedTests=false
          -Dit.test='DemoSyncIT,CoreSyncIT,CorpusConsistencyIT'
          -Dsync.synthetic=all

      - name: Upload the sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report
          path: doom-it/target/sync-report.tsv
          if-no-files-found: ignore
